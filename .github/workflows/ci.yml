name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Pinned so CI validates the same rivet the release workflow ships with.
env:
  RIVET_PIN: v0.11.0

jobs:
  engine:
    name: Engine tests + backend compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install deps (docs/ci.md standard; rivet pinned)
        run: raco pkg install --auto --no-docs crypto 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Engine tests
        run: raco test tests/
      - name: Backend compiles against the RVT1 contract
        run: raco make app/backend.rkt

  macos:
    name: macOS host build
    needs: engine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - run: raco pkg install --auto --no-docs crypto 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - run: raco rivet build
