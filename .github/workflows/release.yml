name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Single source of truth for the rivet pin; every install step below
# references this so a bump is one edit, not a grep-replace across jobs.
env:
  RIVET_PIN: v0.11.0

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest, racket-arch: arm64 }
          - { arch: x64, runner: macos-15-intel, racket-arch: x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (pinned, matches the local release drills)
        run: raco pkg install --auto --no-docs crypto 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      - name: Version preflight (rivet.rktd == tag == CHANGELOG)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # DMG (human installer) + portable zip + launch smoke, no update
      # feed: keyward is a key vault and does not update itself yet —
      # the release ships with plain SHA256SUMS for integrity.
      - name: Release (DMG + portable zip)
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          # rivet names the portable zip in family form already; only
          # the DMG lacks the architecture.
          mv "keyward-${VERSION}-macos.dmg" "keyward-${VERSION}-macos-${ARCH}.dmg"
          for f in keyward-*.dmg keyward-*.zip; do
            [ -f "$f" ] || continue
            [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256"
          done
      # The sbom/notices bodies stay in the CI artifact only; the
      # release carries installers and their sidecars, nothing else.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/keyward-*

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: '9.3'
      - name: Install Rivet (catalog)
        shell: pwsh
        run: raco pkg install --auto --no-docs crypto 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
      # WiX v5 is rivet's MSI toolchain (raco rivet release shells out to it).
      - name: Install WiX
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2
      - name: Version preflight (rivet.rktd == tag == CHANGELOG)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # MSI (human installer) + portable zip + launch smoke, no update
      # feed: keyward is a key vault and does not update itself —
      # same decision as the macOS leg.
      - name: Release (MSI + portable zip)
        shell: pwsh
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          # rivet names the MSI and portable zip in family form already;
          # give the SBOM the family name so it rides the release.
          mv sbom.cdx.json "keyward-${VERSION}-windows-x64.sbom.cdx.json"
          for f in keyward-*; do
            case "$f" in
              *.sha256) ;;
              # The sbom/wixpdb bodies stay unchecksummed; checksum what
              # users verify by hand (installers and their sidecars).
              *.sbom.cdx.json | *.wixpdb) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256";;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/keyward-*

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-latest, racket-arch: x64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, racket-arch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@v0.11.0
      # Installed after the embeddable runtime so the catalog dependency
      # closure (cext-lib, crypto-lib, keel) resolves against the minimal
      # build — it ships no packages of its own. crypto backs keyward's
      # Ed25519 key work.
      - name: Install Rivet (catalog) and backend packages
        run: |
          raco pkg install --auto --no-docs 'https://github.com/turinglambdaai/rivet.git#${{ env.RIVET_PIN }}'
          raco pkg install --auto --no-docs crypto
      - name: Install GTK4, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libgtk-4-dev libadwaita-1-dev libjson-glib-dev libsecret-1-dev \
            libglib2.0-dev cmake ninja-build pkg-config file \
            rpm desktop-file-utils
      - name: Version preflight (rivet.rktd == tag == CHANGELOG)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # tar.gz (portable) + deb + rpm + AppImage + portable zip + SBOM,
      # launch smoke included. The AppImage carries its own GTK4 dependency
      # closure; APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on the
      # runner.
      - name: Release (tar.gz + deb + rpm + AppImage + portable zip)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: raco rivet release --without-updates --development
      - name: Family naming + checksums
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          cd dist
          mv sbom.cdx.json "keyward-${VERSION}-linux-${ARCH}.sbom.cdx.json"
          for f in keyward-*; do
            case "$f" in
              *.sha256) ;;
              *.sbom.cdx.json) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/keyward-*

  publish:
    name: Publish
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather + publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          # cp -R merges: release legs can leave a dist/keyward-linux-<arch>/
          # staging bundle in the artifacts, and a plain mv dies on the
          # directory collision ("Directory not empty").
          for a in macos-arm64 macos-x64 windows linux-x64 linux-arm64; do
            cp -R "artifacts/$a/." dist/
          done
          # Keep-a-Changelog section: "## 0.1.0 - 2026-10-13" — match the
          # version followed by a space (or end of line), not a bracketed
          # form; a trailing " .0" suffix must not match "0.1".
          awk -v header="## ${VERSION} " '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "empty release notes" >&2; exit 1; }
          cd dist
          for f in *.sha256; do [ -s "$f" ] || rm -f "$f"; done
          cat *.sha256 > SHA256SUMS
          # Stable direct links (site hero / docs point here):
          #   releases/latest/download/keyward-macos-arm64.dmg
          #   releases/latest/download/keyward-macos-x64.dmg
          #   releases/latest/download/keyward-windows-x64.msi
          #   releases/latest/download/keyward-linux-x64.deb
          #   releases/latest/download/keyward-linux-x64.AppImage  (+ arm64 twins)
          # The alias is a byte-for-byte copy of the arch-named asset, so
          # the checksum sidecar of the suffixed name verifies it too.
          cp "keyward-${VERSION}-macos-arm64.dmg" keyward-macos-arm64.dmg
          cp "keyward-${VERSION}-macos-x64.dmg" keyward-macos-x64.dmg
          cp "keyward-${VERSION}-windows-x64.msi" keyward-windows-x64.msi
          cp "keyward-${VERSION}-linux-amd64.deb" keyward-linux-x64.deb
          cp "keyward-${VERSION}-linux-arm64.deb" keyward-linux-arm64.deb
          cp "keyward-${VERSION}-linux-x86_64.AppImage" keyward-linux-x64.AppImage
          cp "keyward-${VERSION}-linux-aarch64.AppImage" keyward-linux-arm64.AppImage
          gh release create "$GITHUB_REF_NAME" \
            --title "Keyward ${VERSION}" \
            --notes-file /tmp/notes.md \
            --latest \
            *.dmg *.zip *.msi *.tar.gz *.deb *.rpm *.AppImage \
            *.sbom.cdx.json *.sha256 SHA256SUMS
